[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LRAEP-trainer"
version = "0.1.0"
description = "GPU training with local protocol implementations"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
LRAEP = "LRAEP_trainer.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
packages = ["LRAEP_trainer", "LRAEP_helpers"]

[tool.setuptools.package-data]
LRAEP_trainer = ["*.cpp", "cuda/*.cu", "cuda/*.cuh", "bin/*", "bin/**/*"]
LRAEP_helpers = ["manifest.json", "python/**/*.py"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
